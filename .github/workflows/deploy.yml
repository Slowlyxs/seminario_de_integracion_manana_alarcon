name: Deploy Django to VPS

on:
  push:
    branches: [ main, master, PRIMER_CORTE ]
  pull_request:
    branches: [ main, master, PRIMER_CORTE ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: shopapi_db
          POSTGRES_USER: shopapi_user
          POSTGRES_PASSWORD: billing_pass_123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' 
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Navigates to your nested app folder to find requirements.txt
        cd modulo2/shopapi
        pip install -r requirements.txt
        
    - name: Run tests
      env:
        DATABASE_URL: postgres://shopapi_user:billing_pass_123@localhost:5432/shopapi_db
        SECRET_KEY: test-secret-key
      run: |
        # Navigates to your nested app folder to find manage.py
        cd modulo2/shopapi
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/PRIMER_CORTE'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USERNAME }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        VENV_PATH: ${{ secrets.VENV_PATH }}
        # Captures the exact branch name being deployed
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        ssh $VPS_USER@$VPS_HOST "
          set -e
          
          echo '1. Actualizando código...'
          cd $PROJECT_PATH
          git fetch origin
          # Dynamically resets to the branch that triggered the action
          git reset --hard origin/$BRANCH_NAME
          
          echo '2. Activando entorno virtual...'
          source $VENV_PATH/bin/activate
          
          echo '3. Instalando dependencias...'
          pip install -r requirements.txt
          
          echo '4. Aplicando migraciones...'
          python manage.py migrate --noinput
          
          echo '5. Colectando archivos estáticos...'
          python manage.py collectstatic --noinput --clear
          
          echo '6. Reiniciando servicios...'
          # Added sudo. Standard users cannot restart systemctl services without it.
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
          
          echo 'Despliegue completado con éxito en la rama $BRANCH_NAME!'
        "
